name: Issue Management Automation

on:
  issues:
    types: [opened, labeled]

jobs:
  issue-triage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-assign labels based on title and body
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const title = issue.title.toLowerCase();
            const body = (issue.body || '').toLowerCase();
            const labelsToAdd = [];
            
            // Always add needs-triage initially
            labelsToAdd.push('needs-triage');
            
            // Category labels based on title
            if (title.includes('bug')) {
              labelsToAdd.push('bug');
            } else if (title.includes('epic')) {
              labelsToAdd.push('epic');
            } else if (title.includes('maintenance')) {
              labelsToAdd.push('maintenance');
            } else {
              labelsToAdd.push('enhancement');
            }
            
            // Priority labels (highest priority wins)
            const priorityMap = [
              { keywords: ['critical', 'urgent', 'production', 'outage'], label: 'priority-critical' },
              { keywords: ['important', 'high', 'blocking'], label: 'priority-high' },
              { keywords: ['medium', 'normal'], label: 'priority-medium' },
              { keywords: ['low', 'nice-to-have', 'minor'], label: 'priority-low' }
            ];
            
            const foundPriorities = priorityMap.filter(priority => 
              priority.keywords.some(keyword => 
                title.includes(keyword) || body.includes(keyword)
              )
            );
            
            if (foundPriorities.length > 0) {
              labelsToAdd.push(foundPriorities[0].label); // Highest priority wins
            } else {
              labelsToAdd.push('priority-medium');
            }
            
            // Add labels to issue
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: labelsToAdd
            });

  task-breakdown:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.title, 'Epic')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create sub-issues for Epic
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const title = issue.title;
            const subTaskNames = [
              'Requirements Analysis',
              'Design and Architecture', 
              'Implementation',
              'Testing and Documentation'
            ];
            
            const subIssueNumbers = [];
            let subIssueMarkdown = '## Epic Tasks\n\n';
            
            // Create 4 sub-issues
            for (let i = 0; i < 4; i++) {
              const taskTitle = `[SUBTASK] ${title} - Task ${i + 1}: ${subTaskNames[i]}`;
              const taskBody = `Related to #${issue.number}\n\n### Task ${i + 1}: ${subTaskNames[i]}\n\nDetailed description of this sub-task for the epic: "${title}".`;
              
              const newSubIssue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: taskTitle,
                body: taskBody,
                labels: ['enhancement', 'needs-review']
              });
              
              subIssueNumbers.push(newSubIssue.data.number);
              subIssueMarkdown += `- [ ] [Task ${i + 1}: ${subTaskNames[i]}](#${newSubIssue.data.number})\n`;
            }
            
            // Update parent issue body with sub-issues
            const currentBody = issue.body || '';
            const updatedBody = currentBody + '\n\n' + subIssueMarkdown;
            
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: updatedBody
            });

  auto-response:
    runs-on: ubuntu-latest
    needs: [issue-triage, task-breakdown]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Process issue response
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const issueLabels = issue.labels.map(label => label.name);
            
            // Check if this is the author's first issue in this repo
            const allIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              creator: issue.user.login,
              state: 'all',
              per_page: 100
            });
            
            const isFirstTimeContributor = allIssues.data.length === 1;
            
            let responseBody = '';
            
            // Add first-time contributor label and welcome message if applicable
            if (isFirstTimeContributor && !issueLabels.includes('first-time-contributor')) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['first-time-contributor']
              });
              
              responseBody = `👋 **Welcome to our project, @${issue.user.login}!**\n\n`;
              responseBody += `Thank you for creating your first issue in this repository. We appreciate your contribution and will get back to you as soon as possible.\n\n`;
            } else {
              responseBody = `Thank you for creating this issue, @${issue.user.login}!\n\n`;
            }
            
            // Type-specific responses
            if (issueLabels.includes('bug')) {
              responseBody += `### Bug Report Guidelines
              - A maintainer will review and confirm this bug
              - Please provide any additional information if requested
              - Check existing issues for duplicates
              - Bug fixes typically take 1-2 weeks to implement
              `;
            } else if (issueLabels.includes('epic')) {
              responseBody += `### Feature Request Process
              - This epic has been broken down into tasks
              - Each task will be tracked as a sub-issue
              - Status updates will be provided as each task progresses
              - New features can take 2-4 weeks to complete
              `;
            } else if (issueLabels.includes('maintenance')) {
              responseBody += `### Maintenance Guidelines
              - All maintenance tasks are reviewed for priority
              - Updates to dependencies and security fixes get immediate attention
              - Housekeeping tasks are scheduled for appropriate timeframes
              - Expected completion varies based on complexity
              `;
            }
            
            // Add milestone for high/critical priority issues
            if (issueLabels.includes('priority-high') || issueLabels.includes('priority-critical')) {
              try {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  milestone: 1 // v1.0.0 milestone ID should be looked up or hardcoded appropriately
                });
              } catch (error) {
                console.log('Could not set milestone:', error);
              }
            }
            
            // Post the response comment and update status
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: responseBody
            });
            
            // Update status from needs-triage to needs-review
            if (issueLabels.includes('needs-triage')) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                name: 'needs-triage'
              });
              
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['needs-review']
              });
            }